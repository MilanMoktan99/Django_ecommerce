{% extends 'base.html' %}

{% block title %}
Checkout
{% endblock %}

{% block content %}

<h1>Checkout</h1>

{% for item in items %}

    <div>

        <h3>
            {{ item.product.name }}
        </h3>

        <p>
            Quantity: {{ item.quantity }}
        </p>

        <p>
            Subtotal: ${{ item.get_subtotal }}
        </p>

    </div>

{% endfor %}

<hr>

<h2>
    Total: ${{ total }}
</h2>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Confirm Order
    </button>

</form>

<a href="{% url 'cart:cart_detail' %}">
    Back to Cart
</a>

{% endblock %}
