{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}

{% block content %}

<h1>Login</h1>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}

    <div>
        <label>Username</label>
        <input type="text" name="username" required>
    </div>

    <div>
        <label>Password</label>
        <input type="password" name="password" required>
    </div>

    <button type="submit">
        Login
    </button>
</form>

<p>
    Don't have an account?
    <a href="{% url 'register' %}">Register</a>
</p>

{% endblock %}
