{% extends 'base.html' %}

{% block title %}
Delete Product
{% endblock %}

{% block content %}

<h1>Delete Product</h1>

<p>
    Are you sure you want to delete
    <strong>{{ product.name }}</strong>?
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

    <a href="{% url 'product_detail' product.pk %}">
        Cancel
    </a>

</form>

{% endblock %}
